<svg width="600" height="500" viewBox="0 0 600 500"
     xmlns="http://www.w3.org/2000/svg">

    <rect width="600" height="500" rx="30" fill="#f8fbff"/>

    <!-- Background circles -->
    <circle cx="480" cy="90" r="90" fill="#dbeafe"/>
    <circle cx="100" cy="410" r="80" fill="#e0f2fe"/>

    <!-- Main card -->
    <rect x="70" y="65" width="460" height="370"
          rx="22" fill="white"
          stroke="#dfe5eb" stroke-width="2"/>

    <!-- Header -->
    <circle cx="105" cy="105" r="7" fill="#22c55e"/>

    <text x="125" y="112"
          font-family="Arial"
          font-size="14"
          font-weight="bold"
          fill="#64748b">
        HYBRID SECURITY
    </text>

    <line x1="100" y1="135"
          x2="500" y2="135"
          stroke="#e2e8f0"/>


    <!-- AES box -->
    <rect x="100" y="175"
          width="160" height="135"
          rx="15"
          fill="#f8fafc"
          stroke="#dfe5eb"/>

    <rect x="150" y="195"
          width="60" height="50"
          rx="10"
          fill="#17202a"/>

    <text x="180" y="227"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="bold"
          fill="white">
        AES
    </text>

    <text x="180" y="270"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="bold"
          fill="#17202a">
        Data Encryption
    </text>

    <text x="180" y="291"
          text-anchor="middle"
          font-family="Arial"
          font-size="11"
          fill="#64748b">
        Fast symmetric encryption
    </text>


    <!-- Plus -->
    <circle cx="300" cy="242"
            r="20"
            fill="#eef2f7"/>

    <text x="300" y="249"
          text-anchor="middle"
          font-family="Arial"
          font-size="20"
          font-weight="bold"
          fill="#17202a">
        +
    </text>


    <!-- RSA box -->
    <rect x="340" y="175"
          width="160" height="135"
          rx="15"
          fill="#f8fafc"
          stroke="#dfe5eb"/>

    <rect x="390" y="195"
          width="60" height="50"
          rx="10"
          fill="#2563eb"/>

    <text x="420" y="227"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="bold"
          fill="white">
        RSA
    </text>

    <text x="420" y="270"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="bold"
          fill="#17202a">
        Key Protection
    </text>

    <text x="420" y="291"
          text-anchor="middle"
          font-family="Arial"
          font-size="11"
          fill="#64748b">
        Secure key encryption
    </text>


    <!-- Protected data -->
    <rect x="100" y="340"
          width="400" height="60"
          rx="12"
          fill="#f0fdf4"
          stroke="#bbf7d0"/>

    <!-- Lock -->
    <rect x="120" y="357"
          width="25" height="22"
          rx="5"
          fill="#17202a"/>

    <path d="M126 357 V351
             C126 343 139 343 139 351 V357"
          fill="none"
          stroke="#17202a"
          stroke-width="5"
          stroke-linecap="round"/>

    <text x="165" y="365"
          font-family="Arial"
          font-size="14"
          font-weight="bold"
          fill="#17202a">
        Protected Data
    </text>

    <text x="165" y="385"
          font-family="Arial"
          font-size="11"
          fill="#64748b">
        Encrypted data + protected session key
    </text>

</svg>